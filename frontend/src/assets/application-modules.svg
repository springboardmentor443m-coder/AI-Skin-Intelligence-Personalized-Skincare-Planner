  <text x="500" y="272" text-anchor="middle" font-size="11" fill="#495057">Primary condition detection</text>

  <rect x="680" y="225" width="280" height="65" rx="12" fill="#e0f0ff" stroke="#1971c2" stroke-width="2"/>
