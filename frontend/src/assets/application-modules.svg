  <rect x="360" y="409" width="280" height="65" rx="12" fill="#e5dbff" stroke="#7048e8" stroke-width="2"/>
  <text x="500" y="436" text-anchor="middle" font-size="13" fill="#1a1a1a">Scan History</text>
  <text x="500" y="456" text-anchor="middle" font-size="11" fill="#495057">Chronological log + thumbnails</text>

  <rect x="680" y="409" width="280" height="65" rx="12" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="820" y="436" text-anchor="middle" font-size="13" fill="#1a1a1a">GlowAI Virtual Assistant</text>
