<svg viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="550" fill="#fafafa"/>
  <text x="500" y="28" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Application Modules — Feature Map</text>

  <!-- Authentication -->
  <rect x="400" y="45" width="200" height="45" rx="12" fill="#ffe0ec" stroke="#d6336c" stroke-width="2"/>
