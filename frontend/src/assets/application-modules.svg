  <line x1="500" y1="90" x2="500" y2="112" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Dashboard hub -->
  <rect x="380" y="114" width="240" height="55" rx="14" fill="#495057" stroke="#212529" stroke-width="2"/>
  <text x="500" y="147" text-anchor="middle" font-size="17" fill="#ffffff">Dashboard</text>

  <!-- bus line -->
  <line x1="500" y1="169" x2="500" y2="195" stroke="#495057" stroke-width="2"/>
  <line x1="180" y1="195" x2="820" y2="195" stroke="#495057" stroke-width="2"/>
  <line x1="180" y1="195" x2="180" y2="225" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="500" y1="195" x2="500" y2="225" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="820" y1="195" x2="820" y2="225" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Row 0 -->
  <rect x="40" y="225" width="280" height="65" rx="12" fill="#ffe0ec" stroke="#d6336c" stroke-width="2"/>
  <text x="180" y="252" text-anchor="middle" font-size="13" fill="#1a1a1a">Skin Scanner</text>
  <text x="180" y="272" text-anchor="middle" font-size="11" fill="#495057">Upload / Live Webcam</text>

  <rect x="360" y="225" width="280" height="65" rx="12" fill="#e0f0ff" stroke="#1971c2" stroke-width="2"/>
