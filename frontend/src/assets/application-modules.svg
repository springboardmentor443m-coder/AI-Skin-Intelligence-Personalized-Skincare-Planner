  <text x="500" y="364" text-anchor="middle" font-size="11" fill="#495057">Groq-generated AM/PM plan</text>

  <rect x="680" y="317" width="280" height="65" rx="12" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
  <text x="820" y="344" text-anchor="middle" font-size="13" fill="#1a1a1a">Skin Analytics &amp; Radar</text>
