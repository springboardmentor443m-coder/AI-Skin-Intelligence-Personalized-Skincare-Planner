  <text x="180" y="344" text-anchor="middle" font-size="13" fill="#1a1a1a">TF-IDF Recommendations</text>
  <text x="180" y="364" text-anchor="middle" font-size="11" fill="#495057">Matched skincare products</text>

  <rect x="360" y="317" width="280" height="65" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
