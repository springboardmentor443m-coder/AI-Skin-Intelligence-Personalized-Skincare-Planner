  <line x1="500" y1="290" x2="500" y2="315" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="820" y1="290" x2="820" y2="315" stroke="#495057" stroke-width="2" marker-end="url(#arrow3)"/>

