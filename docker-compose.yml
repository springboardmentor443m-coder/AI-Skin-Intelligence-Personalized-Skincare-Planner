version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skincare_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skincare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skincare_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./skincare-backend
      dockerfile: Dockerfile
    container_name: skincare_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/skincare_db
      SECRET_KEY: ${SECRET_KEY:-production_secret_key_change_me_in_env_file}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./skincare-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: skincare_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
