version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: skin-intel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skinapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skinapp_pass}
      POSTGRES_DB: ${POSTGRES_DB:-skin_intelligence}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skinapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skin-intel-net

  redis:
    image: redis:7-alpine
    container_name: skin-intel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skin-intel-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skin-intel-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skinapp}:${POSTGRES_PASSWORD:-skinapp_pass}@db:5432/${POSTGRES_DB:-skin_intelligence}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skin-intel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skin-intel-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - skin-intel-net

volumes:
  db_data:

networks:
  skin-intel-net:
    driver: bridge
